[build-system]
requires = ["setuptools>=61.0", "colorama~=0.4.6", "ollama~=0.4.8"]
build-backend = "setuptools.build_meta"

[project]
name = "AI Execute"
version = "0.1.0"

authors = [
  {name="AlexanderJCS"},
]

description = "Use AI to generate terminal commands"
readme = "README.md"

requires-python = ">=3.7"

classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent"
]

[project.urls]
repository = "https://github.com/AlexanderJCS/aix"
homepage = "https://github.com/AlexanderJCS/aix"
issues = "https://github.com/AlexanderJCS/aix/issues"

[project.scripts]
linecount = "linecount.cli:cli"

[options.packages.find]
where = "src"
exclude = ["test"]